<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to StudyNest.">
  <title>Login | StudyNest</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <main class="auth-wrapper">
    <div class="auth-card">
      <a href="login.html" class="brand-logo auth-brand">
        <span class="brand-icon">&#127891;</span>
        <span>StudyNest</span>
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to access your resources, timetable and study tasks.</p>

      <div id="authMessage" class="auth-message" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address *</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@college.edu" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="loginPassword" class="form-label">Password *</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
      <p class="auth-switch" style="margin-top: 15px; font-size: 0.85rem; border-top: 1px solid var(--border-color); padding-top: 12px;">
        Developed by <a href="https://github.com/angad-r" target="_blank" rel="noopener noreferrer">&#128187; @angad-r on GitHub</a>
      </p>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
