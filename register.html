<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account on StudyNest.">
  <title>Register | StudyNest</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <main class="auth-wrapper">
    <div class="auth-card">
      <a href="login.html" class="brand-logo auth-brand">
        <span class="brand-icon">&#127891;</span>
        <span>StudyNest</span>
      </a>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Register to save your own resources, timetable and study tasks.</p>

      <div id="authMessage" class="auth-message" role="alert" hidden></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regName" class="form-label">Full Name *</label>
          <input type="text" id="regName" class="form-control" placeholder="Your full name" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="you@college.edu" autocomplete="email" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="regPassword" class="form-label">Password *</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="form-group">
            <label for="regConfirm" class="form-label">Confirm Password *</label>
            <input type="password" id="regConfirm" class="form-control" placeholder="Re-enter password" autocomplete="new-password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
      </form>

      <p class="auth-switch">Already registered? <a href="login.html">Log in here</a></p>
      <p class="auth-switch" style="margin-top: 15px; font-size: 0.85rem; border-top: 1px solid var(--border-color); padding-top: 12px;">
        Developed by <a href="https://github.com/angad-r" target="_blank" rel="noopener noreferrer">&#128187; @angad-r on GitHub</a>
      </p>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
